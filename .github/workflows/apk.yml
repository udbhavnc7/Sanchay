name: APK

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  assemble_demo_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build current web dashboard into Android assets
        run: pnpm run build

      - name: Build demo APK
        run: ./gradlew assembleDemo

      - name: Check built APK artifact
        run: bash scripts/check-apk-artifact.sh app/build/outputs/apk/demo/app-demo.apk

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Sanchay-Demo.apk
          path: app/build/outputs/apk/demo/app-demo.apk
          if-no-files-found: error

      - name: Upload SHA-256 checksum
        run: sha256sum app/build/outputs/apk/demo/app-demo.apk > Sanchay-Demo.apk.sha256

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: Sanchay-Demo.apk.sha256
          path: Sanchay-Demo.apk.sha256
          if-no-files-found: error
