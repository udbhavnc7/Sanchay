name: Internal Release

# Manual, fail-closed release lane. Nothing is uploaded automatically.
# A maintainer must type app.sanchay and explicitly enable publishing.
on:
  workflow_dispatch:
    inputs:
      confirm_package:
        description: 'Type app.sanchay to confirm this release'
        required: true
        type: string
      publish:
        description: 'Upload the signed AAB to Play internal testing as a draft'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release_candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_package == 'app.sanchay' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: bundle install

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Require release credentials
        run: |
          test -n "$SIGNING_KEYSTORE" || { echo "Missing SIGNING_KEYSTORE secret"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "Missing SIGNING_KEY_ALIAS secret"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "Missing SIGNING_KEY_PASSWORD secret"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "Missing SIGNING_STORE_PASSWORD secret"; exit 1; }
          test -n "$PLAY_CONFIG_JSON" || { echo "Missing GOOGLE_PLAY_CONSOLE_JSON secret"; exit 1; }
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          PLAY_CONFIG_JSON: ${{ secrets.GOOGLE_PLAY_CONSOLE_JSON }}

      - name: Decode signing keystore
        run: printf '%s' "$SIGNING_KEYSTORE" | base64 -d > sign.jks
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}

      - name: Decode Play service account
        run: printf '%s' "$PLAY_CONFIG_JSON" | base64 -d > google-play-console-user.json
        env:
          PLAY_CONFIG_JSON: ${{ secrets.GOOGLE_PLAY_CONSOLE_JSON }}

      - name: Verify release compliance
        run: node scripts/check-release-compliance.mjs

      - name: Build release App Bundle
        run: bundle exec fastlane production_build
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sanchay-release.aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload signed AAB to Play internal testing (draft)
        run: bundle exec fastlane internal_release
        env:
          SANCHAY_PUBLISH_INTERNAL: 'true'
          SANCHAY_CONFIRM_PACKAGE: ${{ inputs.confirm_package }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

  github_release:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_package == 'app.sanchay' && inputs.publish
    runs-on: ubuntu-latest
    needs: release_candidate
    steps:
      - name: Checkout GIT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Enable Gradle caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Read version from libs.versions.toml
        id: get_version
        run: |
          VERSION_NAME=$(grep 'version-name =' gradle/libs.versions.toml | awk -F'=' '{print $2}' | tr -d ' "')
          VERSION_CODE=$(grep 'version-code =' gradle/libs.versions.toml | awk -F'=' '{print $2}' | tr -d ' "')
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Create and push tag
        run: |
          TAG_NAME="v${VERSION_NAME}-${VERSION_CODE}"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Build current web dashboard
        run: pnpm run build

      - name: Build demo APK
        run: ./gradlew assembleDemo

      - name: Upload APK to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Sanchay-Demo.apk
          path: app/build/outputs/apk/demo/app-demo.apk
          if-no-files-found: error

      - name: Prepare changelog
        id: changelog
        continue-on-error: true
        uses: Bullrich/generate-release-changelog@master
        env:
          REPO: ${{ github.repository }}

      - name: Create GitHub Release
        id: create_github_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          release_name: Sanchay ${{ env.TAG_NAME }}
          body: |
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false

      - name: Upload APK to GitHub Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_github_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/demo/app-demo.apk
          asset_name: Sanchay-${{ env.TAG_NAME }}.apk
          asset_content_type: application/vnd.android.package-archive
