name: 'Gradle Wrapper Upgrade'

# Manual only: the inherited task clones the archived upstream Ivy Wallet repo,
# whose layout no longer matches, so a scheduled run fails every day.
on:
  workflow_dispatch:

jobs:
  upgrade-gradle-wrapper:
    runs-on: ubuntu-latest
    env:
      WRAPPER_UPGRADE_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git config --global url."https://unused-username:${WRAPPER_UPGRADE_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Upgrade Gradle Wrapper
        run: ./gradlew upgradeGradleWrapperIvyWallet
